kind = "web"
previewPath = "/"
title = "Proxmox Portal"
version = "1.0.0"
id = "artifacts/proxmox-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19620

[services.development]
run = "pnpm --filter @workspace/proxmox-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/proxmox-portal", "run", "build" ]
publicDir = "artifacts/proxmox-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19620"
BASE_PATH = "/"
