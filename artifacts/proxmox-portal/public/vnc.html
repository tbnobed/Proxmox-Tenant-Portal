<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VM Console</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 8px 16px; background: #1a1a2e; color: #888;
      font-size: 13px; z-index: 10; display: flex;
      align-items: center; gap: 8px; border-bottom: 1px solid #2a2a3e;
    }
    #toolbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
    #toolbar .dot.connected { background: #4ade80; }
    #toolbar .dot.error { background: #f87171; }
    #toolbar .title { font-weight: 600; color: #e0e0e0; white-space: nowrap; }
    #toolbar .info { color: #888; white-space: nowrap; }
    #toolbar .spacer { flex: 1; }
    #toolbar .sep { width: 1px; height: 20px; background: #2a2a3e; flex-shrink: 0; }

    .vm-controls { display: flex; align-items: center; gap: 6px; }
    .vm-status { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 0 6px; }
    .vm-status .sdot { width: 6px; height: 6px; border-radius: 50%; }
    .vm-status .sdot.running { background: #4ade80; }
    .vm-status .sdot.stopped { background: #f87171; }
    .vm-status .sdot.other { background: #facc15; }

    .tbtn {
      background: #2a2a3e; color: #ccc; border: 1px solid #3a3a4e; border-radius: 5px;
      padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s;
    }
    .tbtn:hover { background: #3a3a4e; color: #fff; }
    .tbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tbtn.start { border-color: #53561F44; }
    .tbtn.start:hover { background: #53561F33; color: #E6CAA7; }
    .tbtn.stop { border-color: #f8717144; }
    .tbtn.stop:hover { background: #f8717122; color: #f87171; }
    .tbtn.reboot { border-color: #E6CAA744; }
    .tbtn.reboot:hover { background: #E6CAA722; color: #E6CAA7; }
    .tbtn.cad { background: #2563eb; color: white; border-color: #2563eb; }
    .tbtn.cad:hover { background: #1d4ed8; }

    #screen { position: absolute; top: 42px; bottom: 0; left: 0; right: 0; }
    #error-msg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #f87171; text-align: center; font-size: 16px;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #888; text-align: center; font-size: 16px;
    }
    #loading .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 3px solid #333; border-top-color: #2563eb;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      #toolbar { padding: 6px 10px; gap: 4px; }
      .tbtn { padding: 3px 7px; font-size: 11px; }
      .vm-status { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="dot" id="statusDot"></span>
    <span class="title" id="vmTitle">VM Console</span>
    <span class="info" id="statusText">Initializing...</span>
    <span class="spacer"></span>

    <div class="vm-controls" id="vmControls">
      <div class="vm-status" id="vmStatus">
        <span class="sdot other" id="vmStatusDot"></span>
        <span id="vmStatusText">...</span>
      </div>
      <span class="sep"></span>
      <button class="tbtn start" id="btnStart" style="display:none" onclick="vmAction('start')">&#9654; Start</button>
      <button class="tbtn stop" id="btnStop" style="display:none" onclick="vmAction('stop')">&#9632; Stop</button>
      <button class="tbtn reboot" id="btnReboot" style="display:none" onclick="vmAction('reboot')">&#8635; Reboot</button>
    </div>

    <span class="sep"></span>
    <button class="tbtn cad" onclick="sendCtrlAltDel()">Ctrl+Alt+Del</button>
  </div>
  <div id="screen"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div>Connecting to console...</div>
  </div>
  <div id="error-msg" style="display:none"></div>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const vmName = decodeURIComponent(params.get("name") || "VM");
    const vncPassword = params.get("password") || "";
    const vmId = params.get("vmId");
    const embed = params.get("embed") === "1";
    const initialStatus = params.get("status") || "";

    document.getElementById("vmTitle").textContent = vmName + " Console";
    document.title = vmName + " - Console";

    if (embed) {
      document.getElementById("vmControls").style.display = "none";
    }

    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
    }

    function updateStatus(text) {
      document.getElementById("statusText").textContent = text;
    }

    function updateVmStatus(status) {
      if (embed || !status) return;
      const dotEl = document.getElementById("vmStatusDot");
      const textEl = document.getElementById("vmStatusText");
      const btnStart = document.getElementById("btnStart");
      const btnStop = document.getElementById("btnStop");
      const btnReboot = document.getElementById("btnReboot");

      dotEl.className = "sdot " + (status === "running" ? "running" : status === "stopped" ? "stopped" : "other");
      textEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);

      if (status === "running") {
        btnStart.style.display = "none";
        btnStop.style.display = "inline-flex";
        btnReboot.style.display = "inline-flex";
      } else if (status === "stopped") {
        btnStart.style.display = "inline-flex";
        btnStop.style.display = "none";
        btnReboot.style.display = "none";
      } else {
        btnStart.style.display = "none";
        btnStop.style.display = "none";
        btnReboot.style.display = "none";
      }
    }

    if (initialStatus && !embed) {
      updateVmStatus(initialStatus);
    }

    window.addEventListener("message", function(e) {
      if (!e.data) return;
      if (e.data.type === "vm-status") {
        updateVmStatus(e.data.status);
      }
      if (e.data.type === "vm-action-result") {
        const btnMap = { start: "btnStart", stop: "btnStop", reboot: "btnReboot" };
        const btn = document.getElementById(btnMap[e.data.action]);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = e.data.action === "start" ? "&#9654; Start" : e.data.action === "stop" ? "&#9632; Stop" : "&#8635; Reboot";
        }
        if (!e.data.success) {
          alert("Action failed: " + e.data.message);
        }
      }
    });

    window.vmAction = function(action) {
      if (!vmId) return;
      const btnMap = { start: "btnStart", stop: "btnStop", reboot: "btnReboot" };
      const btn = document.getElementById(btnMap[action]);
      if (btn) {
        btn.disabled = true;
        btn.textContent = action === "start" ? "Starting..." : action === "stop" ? "Stopping..." : "Rebooting...";
      }

      if (window.opener) {
        window.opener.postMessage({ type: "vm-action-request", action: action, vmId: vmId }, "*");
      } else {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = action === "start" ? "&#9654; Start" : action === "stop" ? "&#9632; Stop" : "&#8635; Reboot";
        }
        alert("Cannot perform action: no connection to parent window. Please use the controls in the main portal.");
      }
    };

    if (!token) {
      showError("No console token provided. Please launch the console from the portal.");
    } else {
      updateStatus("Loading noVNC library...");
      import("https://esm.sh/@novnc/novnc@1.4.0/core/rfb.js")
        .then((mod) => {
          const RFB = mod.default;
          connect(RFB, token);
        })
        .catch((err) => {
          showError("Failed to load VNC library: " + err.message);
        });
    }

    let rfb = null;

    function connect(RFB, token) {
      updateStatus("Connecting to VM...");

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host;
      const wsUrl = `${protocol}//${host}/api/vnc?token=${token}`;

      try {
        rfb = new RFB(document.getElementById("screen"), wsUrl, {
          wsProtocols: ["binary"],
          credentials: { password: vncPassword },
        });
        rfb.scaleViewport = true;
        rfb.resizeSession = true;

        rfb.addEventListener("connect", () => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("statusDot").className = "dot connected";
          updateStatus("Connected");
        });

        rfb.addEventListener("disconnect", (e) => {
          document.getElementById("statusDot").className = "dot error";
          if (!e.detail.clean) {
            updateStatus("Connection lost");
            showError("Console connection lost. Close this tab and reconnect from the portal.");
          } else {
            updateStatus("Disconnected");
          }
        });

        rfb.addEventListener("credentialsrequired", () => {
          if (vncPassword) {
            rfb.sendCredentials({ password: vncPassword });
          } else {
            showError("VNC password required but not provided.");
          }
        });

        rfb.addEventListener("securityfailure", (e) => {
          showError("Security failure: " + (e.detail.reason || "Unknown"));
        });
      } catch (err) {
        showError("Failed to connect: " + err.message);
      }
    }

    window.sendCtrlAltDel = function() {
      if (rfb) rfb.sendCtrlAltDel();
    };
  </script>
</body>
</html>
